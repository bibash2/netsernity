global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: netsentry

scrape_configs:
  - job_name: netsentry-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
