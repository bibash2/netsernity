<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetSentry — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0b0f19;
  --bg-card: #111827;
  --border: #1e293b;
  --border-hover: #334155;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-ghost: #475569;
  --green: #34d399;
  --red: #f87171;
  --blue: #60a5fa;
  --radius: 12px;
  --radius-sm: 8px;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(52,211,153,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(96,165,250,0.04) 0%, transparent 50%),
    var(--bg);
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 48px 40px 40px;
  box-shadow:
    0 0 0 1px var(--border),
    0 20px 60px rgba(0,0,0,0.5),
    0 0 120px rgba(52,211,153,0.03);
  animation: cardIn 0.5s ease-out;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-header {
  text-align: center;
  margin-bottom: 36px;
}

.login-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  margin-bottom: 16px;
  color: var(--green);
}

.login-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--green), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}

.login-subtitle {
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.02em;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(11,15,25,0.8);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-group input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(52,211,153,0.1);
}

.form-group input::placeholder {
  color: var(--text-ghost);
}

.login-error {
  padding: 10px 14px;
  margin-bottom: 16px;
  background: rgba(248,113,113,0.08);
  border: 1px solid rgba(248,113,113,0.2);
  border-radius: var(--radius-sm);
  color: var(--red);
  font-size: 13px;
  font-weight: 500;
  animation: shakeIn 0.3s ease-out;
}

@keyframes shakeIn {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--green);
  color: #000;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}

.login-btn:hover {
  background: #4ade80;
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(52,211,153,0.3);
}

.login-btn:active {
  transform: translateY(0);
}

.login-btn:disabled {
  background: var(--text-ghost);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.login-footer {
  text-align: center;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.login-footer p {
  font-size: 12px;
  color: var(--text-ghost);
}

.login-footer .creds {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 6px;
}

.role-list {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 12px;
}

.role-tag {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 14px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 10px;
  color: var(--text-ghost);
  min-width: 90px;
}

.role-tag .role-name {
  font-weight: 700;
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.role-tag .role-cred {
  font-family: var(--mono);
  font-size: 10px;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 28 28" fill="none">
        <path d="M14 2L26 8v12l-12 6L2 20V8l12-6z" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M14 2v24M2 8l12 6 12-6" stroke="currentColor" stroke-width="1" opacity="0.4"/>
        <circle cx="14" cy="14" r="3" fill="currentColor" opacity="0.8"/>
      </svg>
    </div>
    <div class="login-title">NetSentry</div>
    <div class="login-subtitle">Network Intrusion Detection System</div>
  </div>

  <form id="login-form" autocomplete="on">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
    </div>
    <div id="login-error" class="login-error" style="display:none"></div>
    <button type="submit" id="login-btn" class="login-btn">Sign In</button>
  </form>

  <div class="login-footer">
    <p>Default accounts</p>
    <div class="role-list">
      <div class="role-tag">
        <span class="role-name">Admin</span>
        <span class="role-cred">admin / admin123</span>
      </div>
      <div class="role-tag">
        <span class="role-name">Viewer</span>
        <span class="role-cred">viewer / viewer123</span>
      </div>
    </div>
  </div>
</div>

<script src="/static/auth.js"></script>
</body>
</html>
