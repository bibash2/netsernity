# NIDS Kubernetes deployment.
#
# Apply order:
#   kubectl apply -f namespace.yaml
#   kubectl apply -f configmap.yaml
#   kubectl apply -f secret.yaml      # not checked in — see deployment/kubernetes/README.md
#   kubectl apply -f pvc.yaml
#   kubectl apply -f training-job.yaml   # one-shot
#   kubectl apply -f deployment.yaml
#   kubectl apply -f service.yaml
#   kubectl apply -f hpa.yaml
#   kubectl apply -f ingress.yaml
#
# This file bundles the Deployment + Service + HPA for convenience; the rest live
# in sibling files.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nids-api
  namespace: nids
  labels:
    app: nids
    component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nids
      component: api
  template:
    metadata:
      labels:
        app: nids
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: nids:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NIDS_API__HOST
              value: "0.0.0.0"
            - name: NIDS_API__PORT
              value: "8000"
            - name: NIDS_LOGGING__LEVEL
              value: "INFO"
            - name: NIDS_API__API_KEY
              valueFrom:
                secretKeyRef:
                  name: nids-secret
                  key: api-key
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /app/models_artifacts
              readOnly: true
            - name: logs
              mountPath: /app/logs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: nids-models
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nids-api
  namespace: nids
  labels:
    app: nids
    component: api
spec:
  type: ClusterIP
  selector:
    app: nids
    component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nids-api
  namespace: nids
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nids-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nids-api
  namespace: nids
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nids
      component: api
