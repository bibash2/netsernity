# One-off training job. Run once to populate nids-models PVC.
# The API Deployment waits for the models to exist before its readiness probe passes.
apiVersion: batch/v1
kind: Job
metadata:
  name: nids-trainer
  namespace: nids
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: trainer
          image: nids:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "scripts.train_pipeline"]
          args: ["--config", "/app/config/config.yaml"]
          env:
            - name: NIDS_DATA__N_SAMPLES
              value: "50000"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: models
              mountPath: /app/models_artifacts
            - name: data
              mountPath: /app/data
      volumes:
        - name: config
          configMap:
            name: nids-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: models
          persistentVolumeClaim:
            claimName: nids-models
        - name: data
          persistentVolumeClaim:
            claimName: nids-data
---
# Weekly retrain — keeps models fresh against concept drift.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nids-retrain
  namespace: nids
spec:
  schedule: "0 2 * * 0"          # Sunday 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trainer
              image: nids:1.0.0
              command: ["python", "-m", "scripts.train_pipeline"]
              args: ["--config", "/app/config/config.yaml"]
              resources:
                requests:
                  cpu: "1"
                  memory: "2Gi"
                limits:
                  cpu: "4"
                  memory: "4Gi"
              volumeMounts:
                - name: config
                  mountPath: /app/config
                - name: models
                  mountPath: /app/models_artifacts
                - name: data
                  mountPath: /app/data
          volumes:
            - name: config
              configMap:
                name: nids-config
                items:
                  - key: config.yaml
                    path: config.yaml
            - name: models
              persistentVolumeClaim:
                claimName: nids-models
            - name: data
              persistentVolumeClaim:
                claimName: nids-data
---
# Ingress for public HTTP access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nids-ingress
  namespace: nids
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  rules:
    - host: nids.local            # change to your real hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nids-api
                port:
                  number: 80
