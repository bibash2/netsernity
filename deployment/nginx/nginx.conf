# NIDS reverse proxy.
# Terminates HTTP, enforces basic rate-limiting at the edge, and forwards to the
# FastAPI upstream. Designed to run in front of one or more `api` containers.

user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Basics
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging in a concise combined+latency format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Edge rate limit: 30 req/s per client, bursts up to 60
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Upstream pool — add more server lines to scale horizontally
    upstream nids_api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "geolocation=(), microphone=()" always;

        # Dashboard + static assets
        location = / {
            proxy_pass http://nids_api/;
            include /etc/nginx/proxy_params.conf;
        }
        location /static/ {
            proxy_pass http://nids_api;
            proxy_cache_valid 200 5m;
            include /etc/nginx/proxy_params.conf;
        }

        # API routes: rate-limited
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://nids_api;
            include /etc/nginx/proxy_params.conf;
        }

        # FastAPI docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://nids_api;
            include /etc/nginx/proxy_params.conf;
        }

        # Healthcheck — unthrottled, for load balancers
        location = /healthz {
            access_log off;
            proxy_pass http://nids_api/api/v1/health;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
